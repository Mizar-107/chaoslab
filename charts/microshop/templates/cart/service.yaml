{{- if .Values.cart.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: {{ include "microshop.namespace" . }}
  labels:
    {{- include "microshop.labels" . | nindent 4 }}
    app: cart
    tier: backend
spec:
  type: {{ .Values.cart.service.type }}
  ports:
    - port: {{ .Values.cart.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: cart
{{- end }}
