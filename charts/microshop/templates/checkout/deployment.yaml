{{- if .Values.checkout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: {{ include "microshop.namespace" . }}
  labels:
    {{- include "microshop.labels" . | nindent 4 }}
    app: checkout
    tier: backend
  annotations:
    chaos.mesh.io/inject: "true"
spec:
  replicas: {{ .Values.checkout.replicas }}
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
    spec:
      {{- if .Values.checkout.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.checkout.nodeSelector | nindent 8 }}
      {{- end }}
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      containers:
        - name: checkout
          image: "{{ .Values.checkout.image.repository }}:{{ .Values.checkout.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: RABBITMQ_URL
              value: "amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@rabbitmq:{{ .Values.rabbitmq.service.amqpPort }}"
            - name: CART_SERVICE_URL
              value: "http://cart:{{ .Values.cart.service.port }}"
          envFrom:
            - configMapRef:
                name: microshop-config
          resources:
            {{- toYaml .Values.checkout.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.checkout.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.checkout.readinessProbe | nindent 12 }}
{{- end }}
