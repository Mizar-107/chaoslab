# ============================================================================
# EXPERIMENT EXP-004: DNS Failure
# ============================================================================
# Target Service: frontend (DNS resolution to catalog-service)
# Chaos Type:     DNSChaos (error)
# Duration:       45 seconds
# Risk Level:     🟡 Medium
#
# HYPOTHESIS:
#   "When frontend cannot resolve catalog-service DNS, the application
#    should display a degraded UI with cached product data or a clear
#    error message, rather than crashing or hanging indefinitely."
#
# EXPECTED OUTCOME:
#   - Frontend shows "Products temporarily unavailable" message
#   - Cart functionality remains operational
#   - No cascading failures to other services
#   - DNS cache may provide brief protection
#
# POTENTIAL FINDINGS:
#   ⚠️  Frontend may not handle DNS failures gracefully
#   ⚠️  No client-side caching of product data
#
# BLAST RADIUS:
#   - frontend (direct - cannot reach catalog)
#   - catalog-service (appears down to frontend)
#   - Users - product listings unavailable
#   - Cart/checkout may still work if products already in cart
#
# ABORT CONDITIONS:
#   ⚠️  Frontend pods crash (restarts)
#   ⚠️  Cart operations also fail (cascading)
#   ⚠️  DNS resolution doesn't recover after experiment
#
# MANUAL ABORT:
#   kubectl delete dnschaos exp-004-dns-failure -n microshop
# ============================================================================

apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: exp-004-dns-failure
  namespace: microshop
  labels:
    experiment: exp-004
    experiment-name: dns-failure
    type: dns-failure
    service: frontend
    risk-level: medium
spec:
  action: error
  mode: all
  selector:
    namespaces:
      - microshop
    labelSelectors:
      app: frontend
  patterns:
    - "catalog-service.microshop.svc.cluster.local"
  duration: "45s"
